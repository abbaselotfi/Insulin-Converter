<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه پیشرفته تبدیل و محاسبه دوز انسولین</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link class="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            font-family: 'Tahoma', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 28px;
            width: 100%;
            max-width: 500px;
        }
        .soliqua-nav-btn {
            display: block;
            text-align: center;
            background-color: #00a86b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 168, 107, 0.2);
            transition: background 0.3s;
        }
        .soliqua-nav-btn:hover {
            background-color: #00875a;
        }
        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            background-color: #fcfdfd;
        }
        select:focus, input:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 6px rgba(0, 86, 179, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 24px;
            background-color: #e6f2ff;
            border-right: 4px solid #0056b3;
            padding: 18px;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #004085;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .alert-text {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.4;
            color: #721c24;
            background-color: #f8d7da;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="./soliqua.html" class="soliqua-nav-btn">📘 راهنمای بالینی و ویژگی‌های هر دو قلم Soliqua</a>

    <h2>سامانه کلینیکال تبدیل انسولین</h2>
    
    <div class="form-group">
        <label for="insFrom">انسولین جاری (مبدأ):</label>
        <select id="insFrom" onchange="updateRegimen()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option>
                <option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Basal)">
                <option value="lantus" selected>لانتوس (Glargine U-100)</option>
                <option value="toujeo">توژئو (Glargine U-300)</option>
                <option value="tresiba">دگلودک (Tresiba)</option>
                <option value="levemir">لِومیر (Detemir)</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix)</option>
                <option value="humalog_mix">هومالوگ میکس (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix)</option>
            </optgroup>
            <optgroup label="انسولین‌های سریع‌الاثر (Bolus)">
                <option value="apidra_novorapid">آنالوگ سریع (NovoRapid / Apidra)</option>
                <option value="regular">رگولار انسانی (Regular)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group" id="freqFromBox" style="display: none;">
        <label for="freqFrom">⏱️ فرکانس تزریق انسولین مبدأ:</label>
        <select id="freqFrom" onchange="updateRegimen()">
            <option value="1">۱ بار در روز (QD)</option>
            <option value="2">۲ بار در روز (BID - مجموع دوز ۲۴ ساعته)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="insTo">انسولین جایگزین (مقصد):</label>
        <select id="insTo" onchange="updateRegimen()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option>
                <option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Basal)">
                <option value="lantus">لانتوس (Glargine U-100)</option>
                <option value="toujeo">توژئو (Glargine U-300)</option>
                <option value="tresiba">دگلودک (Tresiba)</option>
                <option value="levemir">لِومیر (Detemir)</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix)</option>
                <option value="humalog_mix">هومالوگ میکس (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷0/۳۰ (Human Mix)</option>
            </optgroup>
            <optgroup label="انسولین‌های سریع‌الاثر (Bolus)">
                <option value="apidra_novorapid">آنالوگ سریع (NovoRapid / Apidra)</option>
                <option value="regular">رگولار انسانی (Regular)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group" id="freqToBox" style="display: none;">
        <label for="freqTo">⏱️ فرکانس تزریق انسولین مقصد:</label>
        <select id="freqTo" onchange="updateRegimen()">
            <option value="1">۱ بار در روز (QD)</option>
            <option value="2">۲ بار در روز (BID)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="currentDose">💊 دوز کل فعلی بیمار در ۲۴ ساعت (Total Daily Dose):</label>
        <input type="number" id="currentDose" placeholder="مثلاً 30" min="1" max="120">
    </div>

    <div class="form-group">
        <label for="guideline">📚 انتخاب گایدلاین مرجع:</label>
        <select id="guideline" onchange="updateStrategies()">
            </select>
    </div>

    <div class="form-group" id="strategyBox">
        <label for="strategy">استراتژی بالینی کاهش دوز:</label>
        <select id="strategy">
            <option value="0.8">کاهش ۲۰ درصدی دوز</option>
            <option value="1.0">پایش مستقیم بالینی دوز معادل</option>
            <option value="0.85">کاهش ۱۵ درصدی دوز</option>
        </select>
    </div>

    <button onclick="convertInsulin()">محاسبه کلینیکال دوز</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">💡 دوز پیشنهادی جدید:</div>
        <div id="resultText" style="font-size: 22px; font-weight: bold; color: #004085;"></div>
        <div id="descText" style="margin-top: 10px; font-size: 14px; line-height: 1.4;"></div>
    </div>

    <div class="alert-text" id="alertBox">
        <strong>⚠️ هشدار بالینی مهم:</strong> محاسبات بر اساس فرمول‌های ریاضی گایدلاین منتخب استخراج شده است. پاسخ بیولوژیک بیمار و تیتراسیون بالینی همواره ارجحیت دارد.
    </div>
</div>

<script>
    // دسته‌بندی علمی انواع انسولین جهت ایزوله‌سازی
    function getGroupType(val) {
        if(['lantus','toujeo','tresiba','levemir','nph_basal'].includes(val)) return 'basal';
        if(['novomix','humalog_mix','ryzodeg','human_mix'].includes(val)) return 'premix';
        if(val === 'soliqua_50' || val === 'soliqua_33') return 'soliqua';
        if(val === 'apidra_novorapid' || val === 'regular') return 'bolus';
        return 'basal';
    }

    function updateRegimen() {
        const insFromSelect = document.getElementById('insFrom');
        const insToSelect = document.getElementById('insTo');
        
        let valFrom = insFromSelect.value;
        let fromGroup = getGroupType(valFrom);

        // ۱. فیلتر کردن هوشمند و یک‌طرفه کرکره مقصد (insTo) بر اساس انتخاب کرکره اول
        for (let opt of insToSelect.options) {
            const optGroup = getGroupType(opt.value);
            let isCompatible = true;

            // قانون اول: عدم امکان انتخاب دقیقاً همان انسولین در مبدأ و مقصد
            if (valFrom === opt.value) isCompatible = false;

            // قانون دوم: اگر در کرکره اول بولوس انتخاب شد، در کرکره دوم بقیه گروه‌ها (پایه/میکس/سولیکوآ) حذف شوند
            if (fromGroup === 'bolus' && optGroup !== 'bolus') isCompatible = false;

            // قانون سوم: اگر در کرکره اول بولوس انتخاب نشد، انسولین‌های بولوس از کرکره دوم کاملاً حذف شوند
            if (fromGroup !== 'bolus' && optGroup === 'bolus') isCompatible = false;

            opt.disabled = !isCompatible;
            opt.style.display = isCompatible ? 'block' : 'none';
        }

        // ۲. بازنشانی خودکار و هوشمند مقدار کرکره دوم در صورت مخفی/غیرفعال شدن گزینه فعلی آن
        let currentToOpt = insToSelect.options[insToSelect.selectedIndex];
        if (!currentToOpt || currentToOpt.disabled || currentToOpt.style.display === 'none') {
            for (let opt of insToSelect.options) {
                if (!opt.disabled && opt.style.display !== 'none') {
                    insToSelect.value = opt.value;
                    break;
                }
            }
        }

        let valTo = insToSelect.value;

        // ۳. بارگذاری داینامیک گایدلاین‌ها بر اساس وضعیت نهایی انتخاب‌ها
        const guidelineSelect = document.getElementById('guideline');
        const previousSelection = guidelineSelect.value;
        guidelineSelect.innerHTML = '';

        if (valFrom.includes('soliqua') || valTo.includes('soliqua')) {
            guidelineSelect.innerHTML = `
                <option value="sanofi">پروتکل رسمی Sanofi / EMA / FDA (پیش‌فرض)</option>
                <option value="ada">گایدلاین ADA</option>
            `;
        } else {
            guidelineSelect.innerHTML = `
                <option value="ada">گایدلاین ADA</option>
                <option value="aace">گایدلاین AACE</option>
                <option value="canadian">گایدلاین Diabetes Canada</option>
                <option value="nice">گایدلاین NICE</option>
            `;
            if(['ada','aace','canadian','nice'].includes(previousSelection)) {
                guidelineSelect.value = previousSelection;
            }
        }

        // ۴. کنترل نمایش فیلدهای فرکانس تزریق بر اساس نوع انسولین فعال
        const strictlyOnceDaily = ['toujeo', 'tresiba', 'soliqua_50', 'soliqua_33'];
        
        const freqFromBox = document.getElementById('freqFromBox');
        if (!strictlyOnceDaily.includes(valFrom) && fromGroup !== 'bolus') {
            freqFromBox.style.display = 'block';
        } else {
            freqFromBox.style.display = 'none';
            document.getElementById('freqFrom').value = '1';
        }

        const freqToBox = document.getElementById('freqToBox');
        if (!strictlyOnceDaily.includes(valTo) && getGroupType(valTo) !== 'bolus') {
            freqToBox.style.display = 'block';
        } else {
            freqToBox.style.display = 'none';
            document.getElementById('freqTo').value = '1';
        }

        // ۵. کنترل نمایش و مقادیر پیش‌فرض جعبه استراتژی کاهش دوز
        const strategyBox = document.getElementById('strategyBox');
        if (valTo.includes('soliqua') || fromGroup === 'bolus') {
            strategyBox.style.display = 'none';
        } else {
            strategyBox.style.display = 'block';
            
            const isBIDFrom = (freqFromBox.style.display !== 'none' && document.getElementById('freqFrom').value === '2');
            const isBIDTo = (freqToBox.style.display !== 'none' && document.getElementById('freqTo').value === '2');
            const strategySelect = document.getElementById('strategy');
            
            if (isBIDFrom) {
                strategySelect.value = "0.8"; 
            } else if (isBIDTo) {
                strategySelect.value = "1.0";
            }
            
            updateStrategies();
        }
    }

    // به‌روزرسانی متون و ادبیات علمی استراتژی‌ها
    function updateStrategies() {
        const guide = document.getElementById('guideline').value;
        const strategySelect = document.getElementById('strategy');
        if (!strategySelect) return;

        const freqFromBox = document.getElementById('freqFromBox');
        const freqToBox = document.getElementById('freqToBox');
        const isBIDFrom = (freqFromBox && freqFromBox.style.display !== 'none' && document.getElementById('freqFrom').value === '2');
        const isBIDTo = (freqToBox && freqToBox.style.display !== 'none' && document.getElementById('freqTo').value === '2');

        let guideName = '';
        if (guide === 'ada') guideName = 'ADA';
        if (guide === 'aace') guideName = 'AACE';
        if (guide === 'canadian') guideName = 'Canada';
        if (guide === 'nice') guideName = 'NICE';
        if (guide === 'sanofi') guideName = 'Sanofi';

        if (isBIDFrom) {
            strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد الزامی بر اساس رژیم BID مبدأ)`;
            strategySelect.options[1].text = `پایش مستقیم (توصیه نمی‌شود - ریسک بالای هیپوگلیسمی)`;
            strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (حداقل تعدیل محافظه‌کارانه)`;
        } else if (isBIDTo) {
            strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد فوق‌محافظه‌کارانه)`;
            strategySelect.options[1].text = `تجویز دوز معادل ۱:۱ و تقسیم آن (رویکرد استاندارد گایدلاین‌ها)`;
            strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (تعدیل احتیاطی بالینی)`;
        } else {
            strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد محافظه‌کارانه بر اساس گایدلاین ${guideName})`;
            strategySelect.options[1].text = `پایش مستقیم بالینی و تجویز دوز معادل بر اساس گایدلاین ${guideName}`;
            strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (تعدیل استاندارد بالینی بر اساس گایدلاین ${guideName})`;
        }
    }

    // موتور محاسباتی اصلی و اعمال فرمول‌های بالینی
    function convertInsulin() {
        const dose = parseFloat(document.getElementById('currentDose').value);
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;
        const guide = document.getElementById('guideline').value;
        
        const isBIDFrom = (document.getElementById('freqFromBox').style.display !== 'none' && document.getElementById('freqFrom').value === '2');
        const isBIDTo = (document.getElementById('freqToBox').style.display !== 'none' && document.getElementById('freqTo').value === '2');
        
        let initialMultiplier = parseFloat(document.getElementById('strategy').value);

        if (isNaN(dose) || dose <= 0) {
            alert('لطفاً دوز معتبری وارد کنید.');
            return;
        }

        let newDose = 0;
        let explanation = "";

        const fromGroup = getGroupType(insFrom);
        const toGroup = getGroupType(insTo);

        // ۱. سناریوی تعویض بولوس به بولوس
        if (fromGroup === 'bolus') {
            newDose = Math.round(dose);
            explanation = "تبدیل انسولین‌های سریع‌الاثر/بولوس (Short/Rapid-acting): طبق راهنماهای بالینی، تعویض بین آنالوگ‌های سریع هم‌گروه (مانند نوورپید به آپیدرا) کاملاً به صورت مستقیم و واحدبه‌واحد (1:1) انجام می‌شود و کاهش دوز ساختاری ندارد.";
        }
        // ۲. سولیکوآ ۱۰۰/۵۰ (قلم زرد)
        else if (insTo === 'soliqua_50') {
            if (dose >= 20 && dose <= 30) {
                newDose = dose;
                explanation = "سوییچ به سولیکوآ ۱۰۰/۵۰ (قلم زرد). طبق پروتکل رسمی Sanofi/EMA، برای TDD انسولین پایه بین ۲۰ تا ۳۰ واحد، شروع درمان بر مبنای دوز معادل انجام می‌شود.";
            } else if (dose < 20) {
                newDose = 10;
                explanation = "به دلیل دوز پایه پایین قبلی (کمتر از ۲۰ واحد)، دوز شروع ایمن از کف دوز قلم زرد یعنی ۱۰ واحد تعیین گردید.";
            } else {
                newDose = 30;
                explanation = "دوز انسولین قبلی بالاتر از سقف شروع قلم زرد است؛ ارزیابی سوییچ مستقیم به قلم ۱۰۰/۳۳ (زیتونی) توصیه می‌شود.";
            }
            if (isBIDFrom) explanation += " [توجه: مجموع دوز ۲۴ ساعته قبلی ملاک محاسبه قرار گرفته است].";
        } 
        // ۳. سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)
        else if (insTo === 'soliqua_33') {
            if (insFrom === 'soliqua_50') {
                if (dose >= 40) {
                    newDose = 40;
                    explanation = "طبق گایدلاین رسمی، سقف تیتراسیون قلم زرد ۴۰ واحد است. برای دوزهای بالاتر، بیمار باید با دوز ۴۰ واحد روی قلم زیتونی (۱۰۰/۳۳) سوییچ شود.";
                } else {
                    newDose = dose;
                    explanation = "انتقال بین دو قلم سولیکوآ بر اساس دوز جاری بیمار تنظیم شد.";
                }
            } else if (dose >= 30) {
                newDose = 30;
                explanation = "سوییچ به سولیکوآ ۱۰۰/۳۳ (قلم زیتونی). برای دوزهای TDD مساوی یا بالای ۳۰ واحد، دوز شروع استاندارد پروتکل ۳۰ واحد است.";
            } else {
                newDose = 30;
                explanation = "شروع پیش‌فرض قلم زیتونی سولیکوآ طبق راهنمای کلینیکال دارو ۳۰ واحد می‌باشد.";
            }
            if (isBIDFrom) explanation += " [توجه: دوز بر اساس مجموع TDD محاسبه شده است].";
        } 
        // ۴. محاسبات عمومی سایر گروه‌ها
        else {
            let finalMultiplier = initialMultiplier;

            if (isBIDFrom) {
                finalMultiplier = 0.80;
                explanation = "محاسبه بر اساس فرکانس BID مبدأ: به دلیل تزریق ۲ بار در روز انسولین مبدأ، گایدلاین‌های بالینی (ADA/AACE) جهت کنترل ریسک هیپوگلیسمی، کاهش حتمی ۲۰ درصدی را روی مجموع TDD اعمال می‌کنند. ";
            } else if (isBIDTo) {
                if (initialMultiplier === 1.0) {
                    finalMultiplier = 1.0;
                    explanation = "دستورالعمل بالینی در تبدیل یک‌بار به دوبار در روز (QD به BID): در این نوع سوییچ، دوز کل روزانه (TDD) نیازی به کاهش پیش‌فرض ندارد و تبدیل ۱:۱ توصیه اصلی گایدلاین‌ها است؛ زیرا شکستن و تقسیم دوز به دو نوبت، خودبه‌خود از تمرکز پیک غلظتی انسولین در یک زمان کاسته و ریسک افت قند خون را به شدت کنترل می‌کند. ";
                } else {
                    finalMultiplier = initialMultiplier;
                    explanation = `محاسبه دوز بر اساس تعدیل احتیاطی انتخاب‌شده با ضریب ${finalMultiplier} جهت انتقال به رژیم BID انجام شد. `;
                }
            } else {
                if (guide === 'ada') {
                    if (insFrom === 'toujeo' && insTo === 'lantus') {
                        finalMultiplier = 0.80; 
                        explanation = "ملاک اختصاصی ADA: در تبدیل توژئو به لانتوس به دلیل تفاوت فارماکوکینتیک، کاهش ۲۰٪ دوز جهت ایمنی الزامی است. ";
                    } else if (insFrom === 'nph_basal' && ['lantus','toujeo','tresiba'].includes(insTo)) {
                        finalMultiplier = 0.80;
                        explanation = "ملاک اختصاصی ADA: تغییر از NPH یک‌بار در روز به آنالوگ‌های پیشرفته طولانی‌اثر، نیازمند کاهش دوز ۲۰٪ جهت پیشگیری از هیپوگلیسمی شبانه است. ";
                    } else if (fromGroup === 'premix' || toGroup === 'premix') {
                        finalMultiplier = 0.80;
                        explanation = "توصیه عمومی ADA: در تعویض رژیم‌های مخلوط (Premix)، فرمول با اعمال ۲۰٪ کاهش احتیاطی محاسبه می‌شود. ";
                    } else {
                        explanation = `محاسبه بر اساس استراتژی منتخب در گایدلاین ADA با ضریب ${finalMultiplier} انجام شد. `;
                    }
                } 
                else if (guide === 'aace') {
                    if (fromGroup !== toGroup) {
                        finalMultiplier = Math.min(finalMultiplier, 0.80); 
                        explanation = "الگوریتم محافظه‌کارانه AACE: در سوییچ‌های بین‌کلاسی، گایدلاین AACE اجازه تبدیل بدون کاهش دوز نداده و کاهش ۲۰ درصدی را قفل می‌کند. ";
                    } else {
                        finalMultiplier = Math.min(finalMultiplier, 0.85);
                        explanation = "رویکرد کنترلی AACE: اعمال کاهش دوز ۱۵ تا ۲۰ درصدی برای پیشگیری ایمن از افت قند خون لحاظ گردید. ";
                    }
                } 
                else if (guide === 'canadian') {
                    if (fromGroup === 'basal' && toGroup === 'basal' && insFrom !== 'toujeo') {
                        finalMultiplier = 1.0; 
                        explanation = "دستورالعمل Diabetes Canada: این گایدلاین تعویض آنالوگ‌های پایه هم‌سطح (مانند لانتوس و دگلودک) را به صورت مستقیم و با پایش بالینی مجاز می‌داند. ";
                    } else if (insFrom === 'nph_basal') {
                        finalMultiplier = 0.80;
                        explanation = "معیار Diabetes Canada: انتقال دوز از NPH به آنالوگ‌های مدرن شامل کاهش ساختاری ۲۰ درصدی دوز کل است. ";
                    } else {
                        explanation = `محاسبه بر اساس استراتژی منتخب در گایدلاین Diabetes Canada با ضریب ${finalMultiplier} انجام شد. `;
                    }
                } 
                else if (guide === 'nice') {
                    if (fromGroup === 'premix' || insFrom === 'nph_basal') {
                        finalMultiplier = 0.80;
                        explanation = "راهنمای کلینیکال NICE: انتقال از ساختارهای سنتی یا مخلوط به آنالوگ‌های خالص، شامل کاهش ۲۰ درصدی دوز پایه کل است. ";
                    } else {
                        explanation = `محاسبه بر اساس استراتژی منتخب در گایدلاین NICE با ضریب ${finalMultiplier} انجام شد. `;
                    }
                }
            }

            newDose = Math.round(dose * finalMultiplier);
            
            if (isBIDTo) {
                let amDose = Math.round(newDose * 0.5);
                let pmDose = newDose - amDose;
                explanation += `\n[توزیع دوز مقصد BID]: پیشنهاد می‌شود دوز کل به صورت ۵۰:۵۰ تقسیم گردد (${amDose} واحد صبح / ${pmDose} واحد شب) یا طبق متد بالینی ۲/۳ صبح و ۱/۳ شب تجویز شود.`;
            }
        }

        document.getElementById('resultText').innerText = `${newDose} واحد`;
        document.getElementById('descText').innerText = explanation;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('alertBox').style.display = 'block';
    }

    window.onload = function() {
        updateRegimen();
    };
</script>
