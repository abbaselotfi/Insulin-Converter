<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبدل جامع و هوشمند انسولین</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            font-family: 'Tahoma', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 28px;
            width: 100%;
            max-width: 500px;
        }
        .soliqua-nav-btn {
            display: block;
            text-align: center;
            background-color: #00a86b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 168, 107, 0.2);
            transition: background 0.3s;
        }
        .soliqua-nav-btn:hover {
            background-color: #00875a;
        }
        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            background-color: #fcfdfd;
        }
        select:focus, input:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 6px rgba(0, 86, 179, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 24px;
            background-color: #e6f2ff;
            border-right: 4px solid #0056b3;
            padding: 18px;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #004085;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .alert-text {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.4;
            color: #721c24;
            background-color: #f8d7da;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="./soliqua.html" class="soliqua-nav-btn">📘 راهنمای بالینی و ویژگی‌های هر دو قلم Soliqua</a>

    <h2>سامانه تبدیل انسولین</h2>
    
    <div class="form-group">
        <label for="insFrom">انسولین فعلی (مبدأ):</label>
        <select id="insFrom" onchange="updateGuidelines()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی - دوز ۱۰ تا ۴۰)</option>
                <option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی - دوز ۳۰ تا ۶۰)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Long-Acting / Basal)">
                <option value="lantus">لانتوس (Glargine U-100) - Lantus</option>
                <option value="toujeo">توژئو (Glargine U-300) - Toujeo</option>
                <option value="tresiba">دگلودک (Tresiba / Degludec)</option>
                <option value="levemir">لِومیر (Detemir) - Levemir</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH/Insulin Isophane)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed / Bi-Phasic)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix 30)</option>
                <option value="humalog_mix">هومالوگ میکس ۲۵ و ۵۰ (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix 70/30)</option>
            </optgroup>
            <optgroup label="انسولین‌های کوتاه‌سوز و سریع‌الاثر (Bolus / Short-Acting)">
                <option value="apidra_novorapid">اسپارت/رپید/گلولیژن (NovoRapid, Apidra, Humalog)</option>
                <option value="regular">رگولار انسانی (Regular / R)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="insTo">انسولین جایگزین (مقصد):</label>
        <select id="insTo" onchange="updateGuidelines()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option>
                <option value="soliqua_33" selected>سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Long-Acting / Basal)">
                <option value="lantus">لانتوس (Glargine U-100) - Lantus</option>
                <option value="toujeo">توژئو (Glargine U-300) - Toujeo</option>
                <option value="tresiba">دگلودک (Tresiba / Degludec)</option>
                <option value="levemir">لِومیر (Detemir) - Levemir</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH/Insulin Isophane)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed / Bi-Phasic)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix 30)</option>
                <option value="humalog_mix">هومالوگ میکس ۲۵ و ۵۰ (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix 70/30)</option>
            </optgroup>
            <optgroup label="انسولین‌های کوتاه‌سوز و سریع‌الاثر (Bolus / Short-Acting)">
                <option value="apidra_novorapid">اسپارت/رپید/گلولیژن (NovoRapid, Apidra, Humalog)</option>
                <option value="regular">رگولار انسانی (Regular / R)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="currentDose">💊 دوز کل فعلی بیمار (واحد):</label>
        <input type="number" id="currentDose" placeholder="مثلاً 30" min="1" max="100">
    </div>

    <div class="form-group">
        <label for="guideline">📚 انتخاب مرجع علمی (گایدلاین):</label>
        <select id="guideline" onchange="updateStrategies()">
            </select>
    </div>

    <div class="form-group" id="strategyBox">
        <label for="strategy">استراتژی احتیاطی کاهش دوز:</label>
        <select id="strategy">
            <option value="0.8">کاهش ۲۰ درصدی دوز (رویکرد محافظه‌کارانه مبتنی بر پروتکل)</option>
            <option value="1.0">تبدیل واحد به واحد ۱:۱ (تحت پایش مستقیم مبتنی بر پروتکل)</option>
            <option value="0.85">کاهش ۱۵ درصدی دوز (تعدیل استاندارد بالینی مبتنی بر پروتکل)</option>
        </select>
    </div>

    <button onclick="convertInsulin()">محاسبه تبدیل دقیق</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">💡 دوز پیشنهادی جدید:</div>
        <div id="resultText" style="font-size: 22px; font-weight: bold; color: #004085;"></div>
        <div id="descText" style="margin-top: 10px; font-size: 14px; line-height: 1.4;"></div>
    </div>

    <div class="alert-text" id="alertBox">
        <strong>⚠️ هشدار بالینی مهم:</strong> محاسبات بر اساس معیارهای ریاضی مرجع منتخب استخراج شده است. تیتراسیون دوز بالینی همواره ارجحیت دارد.
    </div>
</div>

<script>
    function updateGuidelines() {
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;
        const guidelineSelect = document.getElementById('guideline');
        const strategyBox = document.getElementById('strategyBox');
        const previousSelection = guidelineSelect.value;
        
        guidelineSelect.innerHTML = '';

        if (insFrom.includes('soliqua') || insTo.includes('soliqua')) {
            guidelineSelect.innerHTML = `
                <option value="sanofi">پروتکل رسمی Sanofi / EMA / FDA (پیش‌فرض)</option>
                <option value="ada">انجمن دیابت آمریکا (ADA)</option>
            `;
        } else {
            guidelineSelect.innerHTML = `
                <option value="ada">انجمن دیابت آمریکا (ADA)</option>
                <option value="aace">کالج متخصصان غدد آمریکا (AACE)</option>
                <option value="canadian">دیابت کانادا (Diabetes Canada)</option>
                <option value="nice">گایدلاین بالینی انگلستان (NICE)</option>
            `;
            if(['ada','aace','canadian','nice'].includes(previousSelection)) {
                guidelineSelect.value = previousSelection;
            }
        }

        // بهبود تجربه کاربری: در سوییچ به سولیکوآ دوزها ثابت است؛ پس فیلد استراتژی دستی پنهان می‌شود.
        if (insTo.includes('soliqua')) {
            strategyBox.style.display = 'none';
        } else {
            strategyBox.style.display = 'block';
            updateStrategies();
        }
    }

    // ایده طلایی شما: تغییر داینامیک گزینه‌ها با ادبیات تصحیح شده علمی و نام اختصاری گایدلاین
    function updateStrategies() {
        const guide = document.getElementById('guideline').value;
        const strategySelect = document.getElementById('strategy');
        if (!strategySelect) return;

        let guideName = '';
        if (guide === 'ada') guideName = 'ADA';
        if (guide === 'aace') guideName = 'AACE';
        if (guide === 'canadian') guideName = 'Canada';
        if (guide === 'nice') guideName = 'NICE';
        if (guide === 'sanofi') guideName = 'Sanofi';

        strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد محافظه‌کارانه مبتنی بر شیوه‌نامه ${guideName})`;
        strategySelect.options[1].text = `تبدیل واحد به واحد ۱:۱ (تحت پایش مستقیم مبتنی بر شیوه‌نامه ${guideName})`;
        strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (تعدیل استاندارد بالینی مبتنی بر شیوه‌نامه ${guideName})`;
    }

    function getGroupType(val) {
        if(['lantus','toujeo','tresiba','levemir','nph_basal'].includes(val)) return 'basal';
        if(['novomix','humalog_mix','ryzodeg','human_mix'].includes(val)) return 'premix';
        if(val === 'soliqua_50' || val === 'soliqua_33') return 'soliqua';
        return 'bolus';
    }

    function convertInsulin() {
        const dose = parseFloat(document.getElementById('currentDose').value);
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;
        const guide = document.getElementById('guideline').value;
        
        let initialMultiplier = parseFloat(document.getElementById('strategy').value);

        if (isNaN(dose) || dose <= 0) {
            alert('لطفاً دوز معتبری وارد کنید.');
            return;
        }
        if (insFrom === insTo) {
            alert('انسولین مبدأ و مقصد نمی‌تواند یکسان باشد.');
            return;
        }

        let newDose = 0;
        let explanation = "";

        const fromGroup = getGroupType(insFrom);
        const toGroup = getGroupType(insTo);

        if (insTo === 'soliqua_50') {
            if (dose >= 20 && dose <= 30) {
                newDose = dose;
                explanation = "سوییچ به سولیکوآ ۱۰۰/۵۰ (قلم زرد). طبق پروتکل رسمی سانوفی/EMA، برای دوزهای انسولین پایه بین ۲۰ تا ۳۰ واحد، شروع درمان به صورت واحد به واحد (1:1) انجام می‌شود.";
            } else if (dose < 20) {
                newDose = 10;
                explanation = "به دلیل دوز پایه پایین قبلی (کمتر از ۲۰ واحد)، دوز شروع ایمن از کف دوز قلم زرد یعنی ۱۰ واحد تعیین گردید.";
            } else {
                newDose = 30;
                explanation = "دوز انسولین قبلی بالاتر از سقف شروع قلم زرد است؛ ارزیابی سوییچ مستقیم به قلم ۱۰۰/۳۳ (زیتونی) توصیه می‌شود.";
            }
        } 
        else if (insTo === 'soliqua_33') {
            if (insFrom === 'soliqua_50') {
                if (dose >= 40) {
                    newDose = 40;
                    explanation = "طبق گایدلاین رسمی، سقف تیتراسیون قلم زرد ۴۰ واحد است. برای دوزهای بالاتر، بیمار باید دقیقاً با دوز ۴۰ واحد روی قلم زیتونی (۱۰۰/۳۳) سوییچ شود.";
                } else {
                    newDose = dose;
                    explanation = "انتقال بین دو قلم سولیکوآ بر اساس دوز جاری بیمار تنظیم شد.";
                }
            } else if (dose >= 30) {
                newDose = 30;
                explanation = "سوییچ از انسولین پایه قبلی به سولیکوآ ۱۰۰/۳۳ (قلم زیتونی). برای دوزهای پایه قبلی مساوی یا بالای ۳۰ واحد، دوز شروع استاندارد و ایمن مرجع ۳۰ واحد است.";
            } else {
                newDose = 30;
                explanation = "شروع پیش‌فرض قلم زیتونی سولیکوآ طبق راهنمای دارو ۳۰ واحد می‌باشد.";
            }
        } 
        else {
            let finalMultiplier = initialMultiplier;
            let guideText = guide.toUpperCase();

            if (guide === 'ada') {
                if (insFrom === 'toujeo' && insTo === 'lantus') {
                    finalMultiplier = 0.80; 
                    explanation = "ضوابط اختصاصی بالینی ADA: در تبدیل توژئو به لانتوس به دلیل غلظت اثر متفاوت، کاهش حتمی ۲۰ درصدی دوز جهت جلوگیری از خطر افت شدید قند خون اعمال شد.";
                } else if (insFrom === 'nph_basal' && ['lantus','toujeo','tresiba'].includes(insTo)) {
                    finalMultiplier = 0.80;
                    explanation = "ضوابط اختصاصی بالینی ADA: تغییر از انسولین سنتی NPH به آنالوگ‌های پیشرفته طولانی‌اثر، نیازمند کاهش ۲۰ درصدی در دوز پایه برای امنیت شبانه بیمار است.";
                } else if (fromGroup === 'premix' || toGroup === 'premix') {
                    finalMultiplier = 0.80;
                    explanation = "توصیه عمومی ADA: در جابجایی بین انسولین‌های ترکیبی (Premix) و پایه، فرآیند ریاضی با اعمال احتیاط بیست درصدی دوز کل محاسبه می‌شود.";
                } else {
                    explanation = `محاسبه بر اساس استراتژی منتخب در شیوه‌نامه ADA با ضریب تبدیل ${finalMultiplier} اجرا شد.`;
                }
            } 
            else if (guide === 'aace') {
                if (fromGroup !== toGroup) {
                    finalMultiplier = Math.min(finalMultiplier, 0.80); 
                    explanation = "الگوریتم محافظه‌کارانه AACE: به دلیل تفاوت در ساختار کلاسی انسولین‌ها، شیوه‌نامه بالینی AACE اجازه تبدیل ۱:۱ را نداده و کاهش حداقل ۲۰ درصدی را جهت حفظ ایمنی بیمار قفل می‌کند.";
                } else {
                    finalMultiplier = Math.min(finalMultiplier, 0.85);
                    explanation = "رویکرد کنترلی AACE: اعمال کاهش ۱۵ تا ۲۰ درصدی دوز به منظور پایش دقیق سوابق افت قند خون بیمار لحاظ گردید.";
                }
            } 
            else if (guide === 'canadian') {
                if (fromGroup === 'basal' && toGroup === 'basal' && insFrom !== 'toujeo') {
                    finalMultiplier = 1.0; 
                    explanation = "دستورالعمل دیابت کانادا (Diabetes Canada): این شیوه‌نامه تعویض آنالوگ‌های پایه هم‌سطح (مانند لانتوس و دگلودک) را به صورت مستقیم و واحد به واحد ($1:1$) مجاز می‌داند.";
                } else if (insFrom === 'nph_basal') {
                    finalMultiplier = 0.80;
                    explanation = "معیار دیابت کانادا: انتقال دوز از انسولین ان‌پی‌اچ به آنالوگ‌های مدرن بر پایه کاهش ۲۰ درصدی فرمول پایه‌ریزی شده است.";
                } else {
                    explanation = `محاسبه بر اساس استراتژی منتخب در شیوه‌نامه دیابت کانادا با ضریب ${finalMultiplier} انجام گرفت.`;
                }
            } 
            else if (guide === 'nice') {
                if (fromGroup === 'premix' || insFrom === 'nph_basal') {
                    finalMultiplier = 0.80;
                    explanation = "راهنمای بالینی NICE انگلستان: انتقال از ساختارهای سنتی انسانی یا مخلوط به آنالوگ‌های خالص، شامل تعدیل ریاضی کاهش ۲۰ درصدی دوز پایه کل است.";
                } else {
                    explanation = `محاسبه بر اساس راهبرد منتخب در شیوه‌نامه NICE با ضریب ${finalMultiplier} صورت پذیرفت.`;
                }
            }

            newDose = Math.round(dose * finalMultiplier);
        }

        document.getElementById('resultText').innerText = `${newDose} واحد`;
        document.getElementById('descText').innerText = explanation;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('alertBox').style.display = 'block';
    }

    window.onload = function() {
        updateGuidelines();
    };
</script>
</body>
</html>
