<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه پیشرفته تبدیل و محاسبه دوز انسولین</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link class="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            font-family: 'Tahoma', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 28px;
            width: 100%;
            max-width: 500px;
        }
        .soliqua-nav-btn {
            display: block;
            text-align: center;
            background-color: #00a86b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 168, 107, 0.2);
            transition: background 0.3s;
        }
        .soliqua-nav-btn:hover {
            background-color: #00875a;
        }
        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            background-color: #fcfdfd;
        }
        select:focus, input:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 6px rgba(0, 86, 179, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 24px;
            background-color: #e6f2ff;
            border-right: 4px solid #0056b3;
            padding: 18px;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #004085;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .alert-text {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.4;
            color: #721c24;
            background-color: #f8d7da;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="./soliqua.html" class="soliqua-nav-btn">📘 راهنمای بالینی و ویژگی‌های هر دو قلم Soliqua</a>

    <h2>سامانه کلینیکال تبدیل انسولین</h2>
    
    <div class="form-group">
        <label for="insFrom">انسولین جاری (مبدأ):</label>
        <select id="insFrom" onchange="updateRegimen()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option>
                <option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Basal)">
                <option value="lantus" selected>لانتوس (Glargine U-100)</option>
                <option value="toujeo">توژئو (Glargine U-300)</option>
                <option value="tresiba">دگلودک (Tresiba)</option>
                <option value="levemir">لِومیر (Detemir)</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix)</option>
                <option value="humalog_mix_25">هومالوگ میکس ۲۵ (Humalog Mix 25)</option>
                <option value="humalog_mix_50">هومالوگ میکس ۵۰ (Humalog Mix 50)</option>
                <option value="ryzodeg">رایزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix)</option>
            </optgroup>
            <optgroup label="انسولین‌های سریع‌الاثر (Bolus)">
                <option value="apidra_novorapid">آنالوگ سریع (NovoRapid / Apidra)</option>
                <option value="regular">رگولار انسانی (Regular)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group" id="freqFromBox" style="display: none;">
        <label for="freqFrom">⏱️ فرکانس تزریق انسولین مبدأ:</label>
        <select id="freqFrom" onchange="updateRegimen()">
            <option value="1">۱ بار در روز (QD)</option>
            <option value="2">۲ بار در روز (BID)</option>
            <option value="3">۳ بار در روز (TID)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="insTo">انسولین جایگزین (مقصد):</label>
        <select id="insTo" onchange="updateRegimen()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option>
                <option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Basal)">
                <option value="lantus">لانتوس (Glargine U-100)</option>
                <option value="toujeo">توژئو (Glargine U-300)</option>
                <option value="tresiba">دگلودک (Tresiba)</option>
                <option value="levemir">لِومیر (Detemir)</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix)</option>
                <option value="humalog_mix_25">هومالوگ میکس ۲۵ (Humalog Mix 25)</option>
                <option value="humalog_mix_50">هومالوگ میکس ۵۰ (Humalog Mix 50)</option>
                <option value="ryzodeg">رایزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix)</option>
            </optgroup>
            <optgroup label="انسولین‌های سریع‌الاثر (Bolus)">
                <option value="apidra_novorapid">آنالوگ سریع (NovoRapid / Apidra)</option>
                <option value="regular">رگولار انسانی (Regular)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group" id="freqToBox" style="display: none;">
        <label for="freqTo">⏱️ فرکانس تزریق انسولین مقصد:</label>
        <select id="freqTo" onchange="updateRegimen()">
            <option value="1">۱ بار در روز (QD)</option>
            <option value="2">۲ بار در روز (BID)</option>
            <option value="3">۳ بار در روز (TID)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="currentDose">💊 دوز کل فعلی بیمار در ۲۴ ساعت (Total Daily Dose):</label>
        <input type="number" id="currentDose" placeholder="مثلاً 30" min="1" max="120">
    </div>

    <div class="form-group">
        <label for="guideline">📚 انتخاب گایدلاین مرجع:</label>
        <select id="guideline" onchange="updateStrategies()">
            </select>
    </div>

    <div class="form-group" id="strategyBox">
        <label for="strategy">استراتژی بالینی کاهش دوز:</label>
        <select id="strategy">
            <option value="0.8">کاهش ۲۰ درصدی دوز</option>
            <option value="1.0">پایش مستقیم بالینی دوز معادل</option>
            <option value="0.85">کاهش ۱۵ درصدی دوز</option>
        </select>
    </div>

    <button onclick="convertInsulin()">محاسبه کلینیکال دوز</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">💡 دوز پیشنهادی جدید:</div>
        <div id="resultText" style="font-size: 22px; font-weight: bold; color: #004085;"></div>
        <div id="descText" style="margin-top: 10px; font-size: 14px; line-height: 1.4;"></div>
    </div>

    <div class="alert-text" id="alertBox">
        <strong>⚠️ هشدار بالینی مهم:</strong> محاسبات بر اساس فرمول‌های ریاضی گایدلاین منتخب استخراج شده است. پاسخ بیولوژیک بیمار و تیتراسیون بالینی همواره ارجحیت دارد.
    </div>
</div>

<script>
    function getGroupType(val) {
        if(['lantus','toujeo','tresiba','levemir','nph_basal'].includes(val)) return 'basal';
        if(['novomix','humalog_mix_25','humalog_mix_50','ryzodeg','human_mix'].includes(val)) return 'premix';
        if(val === 'soliqua_50' || val === 'soliqua_33') return 'soliqua';
        if(val === 'apidra_novorapid' || val === 'regular') return 'bolus';
        return 'basal';
    }

    function updateRegimen() {
        const insFromSelect = document.getElementById('insFrom');
        const insToSelect = document.getElementById('insTo');
        
        let valFrom = insFromSelect.value;
        let fromGroup = getGroupType(valFrom);

        const optGroups = insToSelect.getElementsByTagName('optgroup');
        for (let group of optGroups) {
            let hasVisibleOption = false;
            const options = group.getElementsByTagName('option');
            
            for (let opt of options) {
                const optGroup = getGroupType(opt.value);
                let isCompatible = true;

                if (valFrom === opt.value) isCompatible = false;
                if (fromGroup === 'bolus' && optGroup !== 'bolus') isCompatible = false;
                if (fromGroup !== 'bolus' && optGroup === 'bolus') isCompatible = false;

                opt.disabled = !isCompatible;
                opt.style.display = isCompatible ? 'block' : 'none';

                if (isCompatible) hasVisibleOption = true;
            }

            if (hasVisibleOption) {
                group.style.display = 'block';
                group.disabled = false;
            } else {
                group.style.display = 'none';
                group.disabled = true;
            }
        }

        let currentToOpt = insToSelect.options[insToSelect.selectedIndex];
        if (!currentToOpt || currentToOpt.disabled || currentToOpt.style.display === 'none') {
            for (let opt of insToSelect.options) {
                if (!opt.disabled && opt.style.display !== 'none') {
                    insToSelect.value = opt.value;
                    break;
                }
            }
        }

        let valTo = insToSelect.value;
        let toGroup = getGroupType(valTo);

        // بروزرسانی داینامیک منوی گایدلاین‌ها
        const guidelineSelect = document.getElementById('guideline');
        const previousSelection = guidelineSelect.value;
        guidelineSelect.innerHTML = '';

        if (valFrom.includes('soliqua') || valTo.includes('soliqua')) {
            guidelineSelect.innerHTML = `
                <option value="sanofi">پروتکل رسمی Sanofi / EMA / FDA (پیش‌فرض)</option>
                <option value="ada">گایدلاین ADA</option>
            `;
        } else {
            guidelineSelect.innerHTML = `
                <option value="ada">گایدلاین ADA</option>
                <option value="aace">گایدلاین AACE</option>
                <option value="canadian">گایدلاین Diabetes Canada</option>
                <option value="nice">گایدلاین NICE</option>
            `;
            if(['ada','aace','canadian','nice'].includes(previousSelection)) {
                guidelineSelect.value = previousSelection;
            }
        }

        const strictlyOnceDaily = ['toujeo', 'tresiba', 'soliqua_50', 'soliqua_33'];
        
        // مدیریت کرکره فرکانس مبدأ
        const freqFromBox = document.getElementById('freqFromBox');
        const freqFromSelect = document.getElementById('freqFrom');
        if (!strictlyOnceDaily.includes(valFrom) && fromGroup !== 'bolus') {
            freqFromBox.style.display = 'block';
            
            // مدیریت گزینه TID (۳ بار در روز) برای مبدأ
            if (fromGroup === 'premix' && valFrom !== 'ryzodeg') {
                if (freqFromSelect.options.length < 3) {
                    let opt = document.createElement('option');
                    opt.value = '3';
                    opt.text = '۳ بار در روز (TID)';
                    freqFromSelect.add(opt);
                }
            } else {
                if (freqFromSelect.options.length > 2) {
                    if (freqFromSelect.value === '3') freqFromSelect.value = '2';
                    freqFromSelect.remove(2);
                }
            }
        } else {
            freqFromBox.style.display = 'none';
            freqFromSelect.value = '1';
        }

        // مدیریت کرکره فرکانس مقصد
        const freqToBox = document.getElementById('freqToBox');
        const freqToSelect = document.getElementById('freqTo');
        if (!strictlyOnceDaily.includes(valTo) && toGroup !== 'bolus') {
            freqToBox.style.display = 'block';
            
            // مدیریت گزینه TID (۳ بار در روز) برای مقصد
            if (toGroup === 'premix' && valTo !== 'ryzodeg') {
                if (freqToSelect.options.length < 3) {
                    let opt = document.createElement('option');
                    opt.value = '3';
                    opt.text = '۳ بار در روز (TID)';
                    freqToSelect.add(opt);
                }
            } else {
                if (freqToSelect.options.length > 2) {
                    if (freqToSelect.value === '3') freqToSelect.value = '2';
                    freqToSelect.remove(2);
                }
            }
        } else {
            freqToBox.style.display = 'none';
            freqToSelect.value = '1';
        }

        const strategyBox = document.getElementById('strategyBox');
        if (valTo.includes('soliqua') || fromGroup === 'bolus') {
            strategyBox.style.display = 'none';
        } else {
            strategyBox.style.display = 'block';
            updateStrategies();
        }
    }

    function updateStrategies() {
        const guide = document.getElementById('guideline').value;
        const strategySelect = document.getElementById('strategy');
        if (!strategySelect) return;

        const isBIDFrom = (document.getElementById('freqFromBox').style.display !== 'none' && document.getElementById('freqFrom').value === '2');
        const isTIDFrom = (document.getElementById('freqFromBox').style.display !== 'none' && document.getElementById('freqFrom').value === '3');
        const isBIDTo = (document.getElementById('freqToBox').style.display !== 'none' && document.getElementById('freqTo').value === '2');
        const isTIDTo = (document.getElementById('freqToBox').style.display !== 'none' && document.getElementById('freqTo').value === '3');

        let guideName = '';
        if (guide === 'ada') guideName = 'ADA';
        if (guide === 'aace') guideName = 'AACE';
        if (guide === 'canadian') guideName = 'Diabetes Canada';
        if (guide === 'nice') guideName = 'NICE';
        if (guide === 'sanofi') guideName = 'Sanofi';

        if (isTIDFrom) {
            strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد الزامی گایدلاین‌ها در رژیم مبدأ TID)`;
            strategySelect.options[1].text = `رویکرد استاندارد گایدلاین ${guideName}`;
            strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (حداقل تعدیل محافظه‌کارانه)`;
            strategySelect.value = "0.8";
        } else if (isBIDFrom) {
            strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد الزامی بر اساس رژیم BID مبدأ)`;
            strategySelect.options[1].text = `رویکرد استاندارد گایدلاین ${guideName}`;
            strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (حداقل تعدیل محافظه‌کارانه)`;
            strategySelect.value = "0.8";
        } else if (isTIDTo || isBIDTo) {
            strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد فوق‌محافظه‌کارانه در رژیم مقصد چندتزریقی)`;
            strategySelect.options[1].text = `رویکرد استاندارد گایدلاین ${guideName}`;
            strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (تعدیل احتیاطی بالینی)`;
            strategySelect.value = "1.0";
        } else {
            strategySelect.options[0].text = `کاهش ۲۰ درصدی دوز (رویکرد محافظه‌کارانه بر اساس گایدلاین ${guideName})`;
            strategySelect.options[1].text = `رویکرد استاندارد گایدلاین ${guideName}`;
            strategySelect.options[2].text = `کاهش ۱۵ درصدی دوز (تعدیل استاندارد بالینی بر اساس گایدلاین ${guideName})`;
            strategySelect.value = "1.0";
        }
    }

    function convertInsulin() {
        const dose = parseFloat(document.getElementById('currentDose').value);
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;
        const guide = document.getElementById('guideline').value;
        
        const isBIDFrom = (document.getElementById('freqFromBox').style.display !== 'none' && document.getElementById('freqFrom').value === '2');
        const isTIDFrom = (document.getElementById('freqFromBox').style.display !== 'none' && document.getElementById('freqFrom').value === '3');
        
        const isBIDTo = (document.getElementById('freqToBox').style.display !== 'none' && document.getElementById('freqTo').value === '2');
        const isTIDTo = (document.getElementById('freqToBox').style.display !== 'none' && document.getElementById('freqTo').value === '3');
        
        let initialMultiplier = parseFloat(document.getElementById('strategy').value);

        if (isNaN(dose) || dose <= 0) {
            alert('لطفاً دوز معتبری وارد کنید.');
            return;
        }

        let newDose = 0;
        let explanation = "";
        let fromGroup = getGroupType(insFrom);
        let toGroup = getGroupType(insTo);

        // لایه اول: استخراج دوز مؤثر (جداسازی بخش بیزال در صورت نیاز)
        let effectiveDose = dose;
        let premixSplitNotice = "";
        
        if (fromGroup === 'premix' && (toGroup === 'basal' || toGroup === 'soliqua')) {
            let premixFactor = 0.70; // پیش‌فرض برای نوومیکس، رایزودگ و میکس انسانی
            let brandName = "نوومیکس/میکس انسانی/رایزودگ (نسبت ۷۰٪ بیزال)";
            
            if (insFrom === 'humalog_mix_25') {
                premixFactor = 0.75;
                brandName = "هومالوگ میکس ۲۵ (نسبت ۷۵٪ بیزال)";
            } else if (insFrom === 'humalog_mix_50') {
                premixFactor = 0.50;
                brandName = "هومالوگ میکس ۵۰ (نسبت ۵۰٪ بیزال)";
            }
            
            effectiveDose = dose * premixFactor;
            premixSplitNotice = `با توجه به اینکه انسولین مبدأ از نوع مخلوط ${brandName} است، ابتدا سهم بخش پایه‌ای (بیزال) آن یعنی ${effectiveDose.toFixed(1)} واحد استخراج گردید. `;
        }

        // لایه دوم: موتور محاسباتی کلینیکال ماتریسی
        
        // ۱. تعویض بولوس به بولوس
        if (fromGroup === 'bolus') {
            newDose = Math.round(dose);
            explanation = "تبدیل انسولین‌های سریع‌الاثر/بولوس: طبق راهنماهای بالینی، تعویض بین آنالوگ‌های سریع هم‌گروه (مانند نوورپید به آپیدرا) کاملاً به صورت مستقیم و واحدبه-واحد (1:1) انجام می‌شود.";
        }
        // ۲. سوییچ به سولیکوآ ۱۰۰/۵۰ (قلم زرد)
        else if (insTo === 'soliqua_50') {
            if (effectiveDose >= 20 && effectiveDose <= 30) {
                newDose = Math.round(effectiveDose);
                explanation = premixSplitNotice + "سوییچ به سولیکوآ ۱۰۰/۵۰ (قلم زرد). طبق پروتکل رسمی Sanofi/EMA، برای دوز انسولین پایه بین ۲۰ تا ۳۰ واحد، شروع درمان بر مبنای دوز معادل انجام می‌شود.";
            } else if (effectiveDose < 20) {
                newDose = 10;
                explanation = premixSplitNotice + "به دلیل دوز پایه پایین قبلی (کمتر از ۲۰ واحد)، دوز شروع ایمن از کف دوز قلم زرد یعنی ۱۰ واحد تعیین گردید.";
            } else {
                newDose = 30;
                explanation = premixSplitNotice + "دوز انسولین پایه محاسباتی بالاتر از سقف شروع قلم زرد است؛ ارزیابی سوییچ مستقیم به قلم ۱۰۰/۳۳ (زیتونی) توصیه می‌شود.";
            }
        } 
        // ۳. سوییچ به سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)
        else if (insTo === 'soliqua_33') {
            if (insFrom === 'soliqua_50') {
                newDose = (dose >= 40) ? 40 : Math.round(dose);
                explanation = (dose >= 40) ? "طبق گایدلاین رسمی، سقف تیتراسیون قلم زرد ۴۰ واحد است. برای دوزهای بالاتر، بیمار باید با دوز ۴۰ واحد روی قلم زیتونی سوییچ شود." : "انتقال بین دو قلم سولیکوآ بر اساس دوز جاری بیمار تنظیم شد.";
            } else if (effectiveDose >= 30) {
                newDose = 30;
                explanation = premixSplitNotice + "سوییچ به سولیکوآ ۱۰۰/۳۳ (قلم زیتونی). برای دوزهای مساوی یا بالای ۳۰ واحد پایه، دوز شروع استاندارد پروتکل ۳۰ واحد است.";
            } else {
                newDose = 30;
                explanation = premixSplitNotice + "شروع پیش‌فرض قلم زیتونی سولیکوآ طبق راهنمای کلینیکال دارو ۳۰ واحد می‌باشد.";
            }
        } 
        // ۴. سناریوی معکوس: تبدیل بیزال به میکس (اضافه شدن بخش پراندیال)
        else if (fromGroup === 'basal' && toGroup === 'premix') {
            let finalMultiplier = initialMultiplier;
            let safetyWarning = "";

            if (insTo === 'humalog_mix_50') {
                finalMultiplier = Math.min(finalMultiplier, 0.80); 
                safetyWarning = "⚠️ هشدار اختصاصی: انسولین مقصد (هومالوگ میکس ۵۰) حاوی ۵۰٪ انسولین سریع‌الاثر است. جهت پیشگیری از هیپوگلیسمی حاد بعد از غذا، کاهش دوز ۲۰٪ به صورت پیش‌فرض اعمال شد. ";
            }

            newDose = Math.round(dose * finalMultiplier);
            explanation = safetyWarning + `سوییچ از انسولین پایه به انسولین میکس با ضریب ${finalMultiplier} انجام شد. دوز کل جدید روزانه ${newDose} واحد می‌باشد. `;

            // توزیع دوز بر اساس فرکانس مقصد
            if (isBIDTo) {
                let amDose = Math.round(newDose * 0.66); // نسبت ۲/۳ صبح
                let pmDose = newDose - amDose;          // نسبت ۱/۳ شب
                explanation += `\n\n[توزیع دوز مقصد BID]: پیشنهاد می‌شود دوز کل به صورت ۲/۳ قبل از صبحانه (${amDose} واحد) و ۱/۳ قبل از شام (${pmDose} واحد) تزریق گردد.`;
            } else if (isTIDTo) {
                let amDose = Math.round(newDose * 0.40);
                let noonDose = Math.round(newDose * 0.30);
                let pmDose = newDose - (amDose + noonDose);
                explanation += `\n\n[توزیع دوز مقصد TID]: رژیم تهاجمی چندتزریقی؛ دوز کل پیشنهادی بین سه وعده تقسیم شود (${amDose} واحد صبح / ${noonDose} واحد ظهر / ${pmDose} واحد شب). پایش مداوم قند خون (SMBG) الزامی است.`;
            } else {
                explanation += `\n\n[توزیع دوز مقصد QD]: دوز کل جدید باید به صورت یک‌بار در روز، دقیقاً قبل از بزرگ‌ترین وعده غذایی بیمار تزریق شود.`;
            }
        }
        // ۵. تبدیل‌های عمومی و چندتزریقی با اعمال ضرایب گایدلاین‌ها
        else {
            let finalMultiplier = initialMultiplier;
            let baseExplanation = "";

            if (guide === 'ada') {
                if (insFrom === 'toujeo' && insTo === 'lantus') {
                    finalMultiplier = 0.80; 
                    baseExplanation = "ملاک اختصاصی ADA: در تبدیل توژئو به لانتوس، اعمال کاهش ۲۰٪ دوز جهت ایمنی الزامی است. ";
                } else if (insFrom === 'nph_basal' && ['lantus','toujeo','tresiba'].includes(insTo)) {
                    finalMultiplier = 0.80;
                    baseExplanation = "ملاک اختصاصی ADA: تغییر از NPH به آنالوگ‌های پیشرفته طولانی‌اثر، نیازمند کاهش دوز ۲۰٪ است. ";
                } else if (fromGroup === 'premix' || toGroup === 'premix') {
                    finalMultiplier = 0.80;
                    baseExplanation = "توصیه عمومی ADA: در تعویض رژیم‌های حاوی مخلوط (Premix)، فرمول با اعمال ۲۰٪ کاهش احتیاطی محاسبه می‌شود. ";
                } else {
                    baseExplanation = `پروتکل دوز بر مبنای معیار انتخابی ADA با ضریب ${finalMultiplier} تنظیم شد. `;
                }
            } 
            else if (guide === 'aace') {
                if (fromGroup !== toGroup || insFrom !== insTo) {
                    finalMultiplier = Math.min(finalMultiplier, 0.80); 
                    baseExplanation = "الگوریتم محافظه‌کارانه AACE: در سوییچ‌های بین‌کلاسی یا تغییر برند انسولین، کاهش ۲۰ درصدی دوز قفل می‌شود. ";
                } else {
                    finalMultiplier = Math.min(finalMultiplier, 0.85);
                    baseExplanation = `رویکرد کنترلی AACE: اعمال کاهش دوز احتیاطی با ضریب ${finalMultiplier} لحاظ گردید. `;
                }
            } 
            else if (guide === 'canadian') {
                if (fromGroup === 'basal' && toGroup === 'basal' && insFrom !== 'toujeo') {
                    baseExplanation = "دستورالعمل Diabetes Canada: این گایدلاین تعویض آنالوگ‌های پایه هم‌سطح را به صورت مستقیم (1:1) مجاز می‌داند. ";
                } else if (insFrom === 'nph_basal') {
                    finalMultiplier = 0.80;
                    baseExplanation = "معیار Diabetes Canada: انتقال دوز از NPH به آنالوگ‌های مدرن شامل کاهش ساختاری ۲۰ درصدی دوز کل است. ";
                } else {
                    baseExplanation = `محاسبه بر اساس استراتژی منتخب در گایدلاین Diabetes Canada با ضریب ${finalMultiplier} انجام شد. `;
                }
            } 
            else if (guide === 'nice') {
                if (fromGroup === 'premix' || insFrom === 'nph_basal') {
                    finalMultiplier = 0.80;
                    baseExplanation = "راهنمای کلینیکال NICE: انتقال از ساختارهای سنتی یا مخلوط به آنالوگ‌های خالص، شامل کاهش ۲۰ درصدی دوز پایه کل است. ";
                } else {
                    baseExplanation = `محاسبه بر اساس استراتژی منتخب در گایدلاین NICE با ضریب ${finalMultiplier} انجام شد. `;
                }
            }

            // لایه سوم: اثر فرکانس‌های چندتزریقی مبدأ (TID و BID)
            if (isTIDFrom) {
                finalMultiplier = Math.min(finalMultiplier, 0.80);
                explanation = premixSplitNotice + "تعدیل رژیم پیچیده (TID Premix به Basal QD): با توجه به فرکانس ۳ بار در روز انسولین میکس، سهم پایه استخراج و به دلیل حذف کامل دوزهای سریع‌الاثر، کاهش دوز ۲۰ درصدی جهت پیشگیری از تجمع دوز اعمال شد. پایش قندهای بعد از غذا ضروری است. " + baseExplanation;
            } else if (isBIDFrom) {
                finalMultiplier = Math.min(finalMultiplier, 0.80);
                explanation = premixSplitNotice + "تعدیل فرکانس (BID به QD): به دلیل فرکانس ۲ بار در روز انسولین مبدأ, جهت جلوگیری از تجمع دوز در یک نوبت، کاهش دوز ۲۰ درصدی بر محاسبات اعمال شد. " + baseExplanation;
            } else if (isBIDTo) {
                if (initialMultiplier === 1.0 && finalMultiplier === 1.0) {
                    explanation = premixSplitNotice + "دستورالعمل بالینی QD به BID: در این نوع سوییچ، تبدیل ۱:۱ توصیه اصلی است؛ زیرا شکستن دوز به دو نوبت، خودبه‌خود ریسک پیک غلظتی را کنترل می‌کند. " + baseExplanation;
                } else {
                    explanation = premixSplitNotice + `محاسبه دوز با ضریب تعدیل بالینی نهایی ${finalMultiplier} جهت انتقال ایمن به رژیم مقصد BID انجام شد. ` + baseExplanation;
                }
            } else {
                explanation = premixSplitNotice + baseExplanation;
            }

            newDose = Math.round(effectiveDose * finalMultiplier);
            
            // پیاده‌سازی توزیع دوز مقصد چندتزریقی برای حالت‌های معمولی
            if (isBIDTo && !isBIDFrom) {
                let amDose = Math.round(newDose * 0.5);
                let pmDose = newDose - amDose;
                explanation += `\n\n[توزیع دوز مقصد BID]: پیشنهاد می‌شود دوز کل به صورت ۵۰:۵۰ تقسیم گردد (${amDose} واحد صبح / ${pmDose} واحد شب) یا طبق متد بالینی ۲/۳ صبح و ۱/۳ شب تجویز شود.`;
            }
        }

        document.getElementById('resultText').innerText = `${newDose} واحد`;
        document.getElementById('descText').innerText = explanation;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('alertBox').style.display = 'block';
    }

    window.onload = function() {
        updateRegimen();
    };
</script>
