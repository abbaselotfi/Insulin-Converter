<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبدل جامع و هوشمند انسولین</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            font-family: 'Tahoma', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 28px;
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            background-color: #fcfdfd;
        }
        select:focus, input:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 6px rgba(0, 86, 179, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
        .result-box {
            margin-top: 24px;
            background-color: #e6f2ff;
            border-right: 4px solid #0056b3;
            padding: 18px;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #004085;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .alert-text {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.4;
            color: #721c24;
            background-color: #f8d7da;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سامانه تبدیل انسولین</h2>

    <div class="form-group">
        <label for="guideline">📚 انتخاب مرجع علمی (گایدلاین):</label>
        <select id="guideline">
            <option value="ada">انجمن دیابت آمریکا (ADA)</option>
            <option value="aace">کالج متخصصان غدد آمریکا (AACE)</option>
            <option value="canadian">دیابت کانادا (Diabetes Canada)</option>
            <option value="nice">گایدلاین بالینی انگلستان (NICE)</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="insFrom">انسولین فعلی (مبدأ):</label>
        <select id="insFrom">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua">سولیکوآ (Soliqua 100/33)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Long-Acting / Basal)">
                <option value="lantus">لانتوس (Glargine U-100) - Lantus</option>
                <option value="toujeo">توژئو (Glargine U-300) - Toujeo</option>
                <option value="tresiba">دگلودک (Tresiba / Degludec)</option>
                <option value="levemir">لِومیر (Detemir) - Levemir</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH/Insulin Isophane)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed / Bi-Phasic)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix 30)</option>
                <option value="humalog_mix">هومالوگ میکس ۲۵ و ۵۰ (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix 70/30)</option>
            </optgroup>
            <optgroup label="انسولین‌های کوتاه‌سوز و سریع‌الاثر (Bolus / Short-Acting)">
                <option value="apidra_novorapid">اسپارت/رپید/گلولیژن (NovoRapid, Apidra, Humalog)</option>
                <option value="regular">رگولار انسانی (Regular / R)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="insTo">انسولین جایگزین (مقصد):</label>
        <select id="insTo">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua">سولیکوآ (Soliqua 100/33)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Long-Acting / Basal)">
                <option value="lantus">لانتوس (Glargine U-100) - Lantus</option>
                <option value="toujeo" selected>توژئو (Glargine U-300) - Toujeo</option>
                <option value="tresiba">دگلودک (Tresiba / Degludec)</option>
                <option value="levemir">لِومیر (Detemir) - Levemir</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH/Insulin Isophane)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed / Bi-Phasic)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix 30)</option>
                <option value="humalog_mix">هومالوگ میکس ۲۵ و ۵۰ (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix 70/30)</option>
            </optgroup>
            <optgroup label="انسولین‌های کوتاه‌سوز و سریع‌الاثر (Bolus / Short-Acting)">
                <option value="apidra_novorapid">اسپارت/رپید/گلولیژن (NovoRapid, Apidra, Humalog)</option>
                <option value="regular">رگولار انسانی (Regular / R)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="currentDose">💊 دوز کل فعلی بیمار در این وعده/شبانه‌روز (واحد):</label>
        <input type="number" id="currentDose" placeholder="مثلاً 30" min="1" max="500">
    </div>

    <div class="form-group" id="reductionBox">
        <label for="strategy">استراتژی کاهش دوز (برای جلوگیری از افت قند خون):</label>
        <select id="strategy">
            <option value="0.8">کاهش ۲۰ درصدی (پیشنهاد ایمن استاندارد)</option>
            <option value="1.0">تبدیل واحد به واحد (۱:۱ بدون کاهش)</option>
            <option value="0.85">کاهش ۱۵ درصدی</option>
        </select>
    </div>

    <button onclick="convertInsulin()">محاسبه تبدیل دقیق</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">💡 دوز پیشنهادی جدید:</div>
        <div id="resultText" style="font-size: 22px; font-weight: bold; color: #004085;"></div>
        <div id="descText" style="margin-top: 10px; font-size: 14px; line-height: 1.4;"></div>
    </div>

    <div class="alert-text" id="alertBox">
        <strong>⚠️ هشدار بالینی مهم:</strong> مقادیر محاسبه شده صرفاً پیشنهاد بر اساس گایدلاین انتخابی شماست. پایش قند خون ناشتا (FBS) و قند خون پس از غذا (2hPP) در ۳ الی ۵ روز اول الزامی است و دوز نهایی بر اساس شرایط بالینی بیمار تیتراسیون (تنظیم) گردد.
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker Live', reg))
                .catch(err => console.log('Service Worker Error', err));
        });
    }

    function getGroupType(val) {
        if(['lantus','toujeo','tresiba','levemir','nph_basal'].includes(val)) return 'basal';
        if(['novomix','humalog_mix','ryzodeg','human_mix'].includes(val)) return 'premix';
        if(val === 'soliqua') return 'soliqua';
        return 'bolus';
    }

    function convertInsulin() {
        const dose = parseFloat(document.getElementById('currentDose').value);
        const guide = document.getElementById('guideline').value;
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;
        const reduction = parseFloat(document.getElementById('strategy').value);

        if (isNaN(dose) || dose <= 0) {
            alert('لطفاً یک عدد معتبر برای دوز فعلی وارد کنید.');
            return;
        }

        let newDose = 0;
        let explanation = "";

        const fromGroup = getGroupType(insFrom);
        const toGroup = getGroupType(insTo);

        if (insFrom === insTo) {
            alert('انسولین مبدأ و مقصد نمی‌تواند یکسان باشد.');
            return;
        }

        // --- منطق اختصاصی سولیکوآ ---
        if (toGroup === 'soliqua') {
            if (fromGroup === 'basal') {
                if (dose < 30) {
                    newDose = 15;
                    explanation = `طبق توصیه‌های ${guide.toUpperCase()}، برای بیمارانی که قبلاً کمتر از ۳۰ واحد انسولین پایه مصرف می‌کردند، دوز شروع سولیکوآ **۱۵ واحد** در روز پیشنهاد می‌شود.`;
                } else if (dose >= 30 && dose <= 60) {
                    newDose = 30;
                    explanation = `طبق توصیه‌های ${guide.toUpperCase()}، برای بیمارانی که قبلاً بین ۳۰ تا ۶۰ واحد انسولین پایه مصرف می‌کردند، دوز شروع سولیکوآ **۳۰ واحد** در روز پیشنهاد می‌شود.`;
                } else {
                    newDose = 30;
                    explanation = `دوز قبلی بیمار بیش از حد مجاز اولیه برای شروع مستقیم قلم استاندارد سولیکوآ (حداکثر ۶۰ واحد پایه) است. شروع با **۳۰ واحد** توصیه شده و تیتراسیون با پایش دقیق انجام شود.`;
                }
            } else {
                newDose = 15;
                explanation = `شروع سولیکوآ از رژیم غیرپایه. دوز شروع پیشنهادی کف گایدلاین یعنی **۱۵ واحد** اعمال شد.`;
            }
        } 
        else if (fromGroup === 'soliqua') {
            if (toGroup === 'basal') {
                newDose = Math.round(dose * reduction);
                let redPercent = Math.round((1 - reduction) * 100);
                explanation = `تبدیل از سولیکوآ به انسولین پایه بر اساس جزء گلارژین آن با اعمال ${redPercent}% کاهش جهت ایمنی محاسبه شد.`;
            } else {
                newDose = Math.round(dose * 0.8);
                explanation = `تغییر رژیم از سولیکوآ به رژیم‌های دیگر. کاهش احتیاطی ۲۰ درصدی دوز کل اعمال شد.`;
            }
        }
        // --- منطق قبلی انسولین‌ها ---
        else if (fromGroup === 'basal' && toGroup === 'basal') {
            if (insFrom === 'toujeo' && insTo === 'lantus') {
                newDose = Math.round(dose * 0.8);
                explanation = `بر اساس گایدلاین ${guide.toUpperCase()}، برای تبدیل توژئو به لانتوس جهت جلوگیری از افت قند خون، کاهش ۲۰ درصدی دوز اعمال شد.`;
            } else {
                newDose = Math.round(dose * reduction);
                let redPercent = Math.round((1 - reduction) * 100);
                explanation = `تبدیل انسولین پایه به پایه با در نظر گرفتن ${redPercent}% کاهش دوز انجام شد.`;
            }
        } 
        else if (fromGroup === 'premix' && toGroup === 'premix') {
            newDose = Math.round(dose * reduction);
            let redPercent = Math.round((1 - reduction) * 100);
            explanation = `تبدیل انسولین مخلوط به مخلوط با در نظر گرفتن ${redPercent}% تنظیم دوز انجام شد.`;
        } 
        else if (fromGroup === 'basal' && toGroup === 'premix') {
            newDose = Math.round(dose * 0.8); 
            explanation = `با توجه به تغییر از انسولین پایه به مخلوط (طبق رفرنس ${guide.toUpperCase()})، کل دوز انسولین پایه قبلی به ۸۰٪ کاهش یافته و به دو دوز مساوی یا نسبت‌های مشخص تقسیم می‌گردد.`;
        } 
        else if (fromGroup === 'premix' && toGroup === 'basal') {
            newDose = Math.round(dose * 0.8);
            explanation = `تغییر از پرمیکس به پایه (مطابق دستورالعمل ${guide.toUpperCase()}): دوز پایه جدید معادل ۸۰٪ دوز کل پرمیکس قبلی پیشنهاد می‌گردد.`;
        }
        else {
            newDose = Math.round(dose * reduction);
            explanation = `تبدیل بر اساس استراتژی منتخب در رفرنس ${guide.toUpperCase()} محاسبه گردید.`;
        }

        document.getElementById('resultText').innerText = `${newDose} واحد`;
        document.getElementById('descText').innerText = explanation;

        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('alertBox').style.display = 'block';
    }
</script>

</body>
</html>
