<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سامانه پیشرفته تبدیل و محاسبه دوز انسولین</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0056b3"><link class="apple-touch-icon" href="icon-192.png"><style>body{font-family:'Tahoma','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#eef2f7;color:#333;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{background-color:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:28px;width:100%;max-width:500px}.soliqua-nav-btn{display:block;text-align:center;background-color:#00a86b;color:#fff;text-decoration:none;padding:12px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:20px;box-shadow:0 4px 12px rgba(0,168,107,.2);transition:background .3s}.soliqua-nav-btn:hover{background-color:#00875a}h2{color:#0056b3;text-align:center;margin-bottom:20px;font-size:22px;border-bottom:2px solid #0056b3;padding-bottom:12px}.form-group{margin-bottom:18px}label{display:block;margin-bottom:6px;font-weight:700;font-size:14px;color:#333}select,input{width:100%;padding:12px;border:1px solid #b0c4de;border-radius:8px;box-sizing:border-box;font-size:14px;font-family:inherit;background-color:#fcfdfd}select:focus,input:focus{border-color:#0056b3;outline:none;box-shadow:0 0 6px rgba(0,86,179,.3)}button{background-color:#007bff;color:#fff;border:none;padding:14px;width:100%;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:background .3s,transform .1s;margin-top:10px}button:hover{background-color:#0056b3}.result-box{margin-top:24px;background-color:#e6f2ff;border-right:4px solid #0056b3;padding:18px;border-radius:0 8px 8px 0;display:none}.result-title{font-weight:700;color:#004085;margin-bottom:8px;font-size:16px}.alert-text{margin-top:16px;font-size:13px;line-height:1.4;color:#721c24;background-color:#f8d7da;padding:12px;border-radius:6px;border-left:4px solid #f5c6cb;display:none}</style></head><body><div class="container"><a href="./soliqua.html" class="soliqua-nav-btn">📘 راهنمای بالینی و ویژگی‌های قلم انسولین سولیکوآ Soliqua</a><h2>سامانه کلینیکال تبدیل انسولین</h2><div class="form-group"><label for="insFrom">انسولین جاری (مبدأ):</label><select id="insFrom" onchange="updateRegimen()"><optgroup label="انسولین‌های ترکیبی مدرن (FRC)"><option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option><option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option></optgroup><optgroup label="انسولین‌های پایه (Basal)"><option value="lantus" selected>لانتوس (Glargine U-100)</option><option value="toujeo">توژئو (Glargine U-300)</option><option value="tresiba">دگلودک (Tresiba)</option><option value="levemir">لِومیر (Detemir)</option><option value="nph_basal">ان‌پی‌اچ (NPH)</option></optgroup><optgroup label="انسولین‌های مخلوط (Premixed)"><option value="novomix">نوومیکس ۳۰ (NovoMix)</option><option value="humalog_mix_25">هومالوگ میکس ۲۵ (Humalog Mix 25)</option><option value="humalog_mix_50">هومالوگ میکس ۵۰ (Humalog Mix 50)</option><option value="ryzodeg">رایزودگ (Ryzodeg)</option><option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix)</option></optgroup><optgroup label="انسولین‌های سریع‌الاثر (Bolus)"><option value="apidra_novorapid">آنالوگ سریع (NovoRapid / Apidra)</option><option value="regular">رگولار انسانی (Regular)</option></optgroup></select></div><div class="form-group" id="freqFromBox" style="display:none"><label for="freqFrom">⏱️ فرکانس تزریق انسولین مبدأ:</label><select id="freqFrom" onchange="updateRegimen()"><option value="1">۱ بار در روز (QD)</option><option value="2">۲ بار در روز (BID)</option><option value="3">۳ بار در روز (TID)</option></select></div><div class="form-group"><label for="insTo">انسولین جایگزین (مقصد):</label><select id="insTo" onchange="updateRegimen()"><optgroup label="انسولین‌های ترکیبی مدرن (FRC)"><option value="soliqua_combined">Soliqua 100/50 یا Soliqua 100/33</option></optgroup><optgroup label="انسولین‌های پایه (Basal)"><option value="lantus">لانتوس (Glargine U-100)</option><option value="toujeo">توژئو (Glargine U-300)</option><option value="tresiba">دگلودک (Tresiba)</option><option value="levemir">لِومیر (Detemir)</option><option value="nph_basal">ان‌پی‌اچ (NPH)</option></optgroup><optgroup label="انسولین‌های مخلوط (Premixed)"><option value="novomix">نوومیکس ۳۰ (NovoMix)</option><option value="humalog_mix_25">هومالوگ میکس ۲۵ (Humalog Mix 25)</option><option value="humalog_mix_50">هومالوگ میکس ۵۰ (Humalog Mix 50)</option><option value="ryzodeg">رایزودگ (Ryzodeg)</option><option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix)</option></optgroup><optgroup label="انسولین‌های سریع‌الاثر (Bolus)"><option value="apidra_novorapid">آنالوگ سریع (NovoRapid / Apidra)</option><option value="regular">رگولار انسانی (Regular)</option></optgroup></select></div><div class="form-group" id="freqToBox" style="display:none"><label for="freqTo">⏱️ فرکانس تزریق انسولین مقصد:</label><select id="freqTo" onchange="updateRegimen()"><option value="1">۱ بار در روز (QD)</option><option value="2">۲ بار در روز (BID)</option><option value="3">۳ بار در روز (TID)</option></select></div><div class="form-group"><label for="currentDose">💊 دوز کل فعلی بیمار در ۲۴ ساعت (Total Daily Dose):</label><input type="number" id="currentDose" placeholder="مثلاً 30" min="1" max="120"></div><div class="form-group"><label for="guideline">📚 انتخاب گایدلاین مرجع:</label><select id="guideline" onchange="updateStrategies()"></select></div><div class="form-group" id="strategyBox"><label for="strategy">استراتژی بالینی کاهش دوز:</label><select id="strategy"><option value="0.8">کاهش ۲۰ درصدی دوز</option><option value="1.0">پایش مستقیم بالینی دوز معادل</option><option value="0.85">کاهش ۱۵ درصدی دوز</option></select></div><button onclick="convertInsulin()">محاسبه کلینیکال دوز</button><div class="result-box" id="resultBox"><div class="result-title">💡 دوز پیشنهادی جدید:</div><div id="resultText" style="font-size:20px;line-height:1.5"></div><div id="descText" style="margin-top:10px;font-size:14px;line-height:1.4"></div></div><div class="alert-text" id="alertBox"><strong>⚠️ هشدار بالینی مهم:</strong> محاسبات بر اساس فرمول‌های ریاضی گایدلاین منتخب استخراج شده است. پاسخ بیولوژیک بیمار و تیتراسیون بالینی همواره ارجحیت دارد.</div></div><script src="insulin-logic.js"></script><script src="pwa-handler.js"></script></body></html>
