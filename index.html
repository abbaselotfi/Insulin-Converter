<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبدل جامع و هوشمند انسولین</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            font-family: 'Tahoma', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 28px;
            width: 100%;
            max-width: 500px;
        }
        .soliqua-nav-btn {
            display: block;
            text-align: center;
            background-color: #00a86b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 168, 107, 0.2);
            transition: background 0.3s;
        }
        .soliqua-nav-btn:hover {
            background-color: #00875a;
        }
        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            background-color: #fcfdfd;
        }
        select:focus, input:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 6px rgba(0, 86, 179, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 24px;
            background-color: #e6f2ff;
            border-right: 4px solid #0056b3;
            padding: 18px;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #004085;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .alert-text {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.4;
            color: #721c24;
            background-color: #f8d7da;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="soliqua.html" class="soliqua-nav-btn">📘 راهنمای بالینی و ویژگی‌های هر دو قلم Soliqua</a>

    <h2>سامانه تبدیل انسولین</h2>

    <div class="form-group">
        <label for="guideline">📚 انتخاب مرجع علمی (گایدلاین):</label>
        <select id="guideline">
            <option value="ada">انجمن دیابت آمریکا (ADA)</option>
            <option value="aace">کالج متخصصان غدد آمریکا (AACE)</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="insFrom">انسولین فعلی (مبدأ):</label>
        <select id="insFrom">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی - دوز ۱۰ تا ۴۰)</option>
                <option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی - دوز ۳۰ تا ۶۰)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Basal)">
                <option value="lantus">لانتوس (Glargine U-100)</option>
                <option value="toujeo">توژئو (Glargine U-300)</option>
                <option value="nph">ان‌پی‌اچ (NPH)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="insTo">انسولین جایگزین (مقصد):</label>
        <select id="insTo">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option>
                <option value="soliqua_33" selected>سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Basal)">
                <option value="lantus">لانتوس (Glargine U-100)</option>
                <option value="toujeo">توژئو (Glargine U-300)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="currentDose">💊 دوز کل فعلی بیمار (واحد):</label>
        <input type="number" id="currentDose" placeholder="مثلاً 25" min="1" max="100">
    </div>

    <button onclick="convertInsulin()">محاسبه تبدیل دقیق</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">💡 دوز پیشنهادی جدید:</div>
        <div id="resultText" style="font-size: 22px; font-weight: bold; color: #004085;"></div>
        <div id="descText" style="margin-top: 10px; font-size: 14px; line-height: 1.4;"></div>
    </div>

    <div class="alert-text" id="alertBox">
        <strong>⚠️ هشدار بالینی مهم:</strong> محاسبات بر اساس گایدلاین سانوفی و EMA انجام شده است. پایش قند خون تیتراسیون را الزامی می‌سازد.
    </div>
</div>

<script>
    function convertInsulin() {
        const dose = parseFloat(document.getElementById('currentDose').value);
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;

        if (isNaN(dose) || dose <= 0) {
            alert('لطفاً دوز معتبری وارد کنید.');
            return;
        }
        if (insFrom === insTo) {
            alert('انسولین مبدأ و مقصد نمی‌تواند یکسان باشد.');
            return;
        }

        let newDose = 0;
        let explanation = "";

        if (insTo === 'soliqua_50') {
            if (dose >= 20 && dose <= 30) {
                newDose = dose; // دوز سوییچ مستقیم طبق رفرنس
                explanation = "سوییچ به سولیکوآ ۱۰۰/۵۰ (قلم زرد). برای بیماران با سابقه درمان انسولین پایه بین ۲۰ تا ۳۰ واحد، شروع واحد به واحد با قلم ۱۰۰/۵۰ پیشنهاد می‌شود.";
            } else if (dose < 20) {
                newDose = 10;
                explanation = "با توجه به دوز پایین قبلی، شروع ایمن از کف دوز قلم زرد (۱۰ واحد) توصیه می‌گردد.";
            } else {
                newDose = 30;
                explanation = "دوز قبلی برای قلم زرد بالاست؛ پیشنهاد می‌شود وضعیت بیمار برای سوییچ به قلم ۱۰۰/۳۳ (زیتونی) ارزیابی شود.";
            }
        } 
        else if (insTo === 'soliqua_33') {
            if (insFrom === 'soliqua_50') {
                if (dose >= 40) {
                    newDose = 40;
                    explanation = "طبق پروتکل رسمی سانوفی، سقف دوز قلم ۱۰۰/۵۰ معادل ۴۰ واحد است. برای ادامه درمان و تیتراسیون افزایشی، بیمار باید با دوز ۴۰ واحد روی قلم ۱۰۰/۳۳ (زیتونی) سوییچ شود.";
                } else {
                    newDose = dose;
                    explanation = "انتقال بین دو قلم بر اساس دوز فعلی بیمار تنظیم گردید.";
                }
            } else if (dose >= 30) {
                newDose = 30;
                explanation = "سوییچ از انسولین پایه قبلی به سولیکوآ ۱۰۰/۳۳ (قلم زیتونی). برای دوزهای پایه قبلی بالای ۳۰ واحد، دوز شروع استاندارد قلم زیتونی ۳۰ واحد است.";
            } else {
                newDose = 30;
                explanation = "شروع پیش‌فرض قلم ۱۰۰/۳۳ بر اساس گایدلاین سانوفی ۳۰ واحد می‌باشد.";
            }
        } else {
            newDose = Math.round(dose * 0.8);
            explanation = "تبدیل از سولیکوآ به انسولین پایه با ۲۰٪ کاهش دوز احتیاطی جهت ایمنی بیمار محاسبه شد.";
        }

        document.getElementById('resultText').innerText = `${newDose} واحد`;
        document.getElementById('descText').innerText = explanation;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('alertBox').style.display = 'block';
    }
</script>
</body>
</html>
