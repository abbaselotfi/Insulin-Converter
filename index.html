<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبدل جامع و هوشمند انسولین</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            font-family: 'Tahoma', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 28px;
            width: 100%;
            max-width: 500px;
        }
        .soliqua-nav-btn {
            display: block;
            text-align: center;
            background-color: #00a86b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 168, 107, 0.2);
            transition: background 0.3s;
        }
        .soliqua-nav-btn:hover {
            background-color: #00875a;
        }
        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            background-color: #fcfdfd;
        }
        select:focus, input:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 6px rgba(0, 86, 179, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 24px;
            background-color: #e6f2ff;
            border-right: 4px solid #0056b3;
            padding: 18px;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #004085;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .alert-text {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.4;
            color: #721c24;
            background-color: #f8d7da;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="./soliqua.html" class="soliqua-nav-btn">📘 راهنمای بالینی و ویژگی‌های هر دو قلم Soliqua</a>

    <h2>سامانه تبدیل انسولین</h2>
    
    <div class="form-group">
        <label for="insFrom">انسولین فعلی (مبدأ):</label>
        <select id="insFrom" onchange="updateGuidelines()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی - دوز ۱۰ تا ۴۰)</option>
                <option value="soliqua_33">سولیکوآ ۱۰۰/۳۳ (قلم زیتونی - دوز ۳۰ تا ۶۰)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Long-Acting / Basal)">
                <option value="lantus">لانتوس (Glargine U-100) - Lantus</option>
                <option value="toujeo">توژئو (Glargine U-300) - Toujeo</option>
                <option value="tresiba">دگلودک (Tresiba / Degludec)</option>
                <option value="levemir">لِومیر (Detemir) - Levemir</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH/Insulin Isophane)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed / Bi-Phasic)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix 30)</option>
                <option value="humalog_mix">هومالوگ میکس ۲۵ و ۵۰ (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix 70/30)</option>
            </optgroup>
            <optgroup label="انسولین‌های کوتاه‌سوز و سریع‌الاثر (Bolus / Short-Acting)">
                <option value="apidra_novorapid">اسپارت/رپید/گلولیژن (NovoRapid, Apidra, Humalog)</option>
                <option value="regular">رگولار انسانی (Regular / R)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="insTo">انسولین جایگزین (مقصد):</label>
        <select id="insTo" onchange="updateGuidelines()">
            <optgroup label="انسولین‌های ترکیبی مدرن (FRC)">
                <option value="soliqua_50">سولیکوآ ۱۰۰/۵۰ (قلم زرد/هلویی)</option>
                <option value="soliqua_33" selected>سولیکوآ ۱۰۰/۳۳ (قلم زیتونی)</option>
            </optgroup>
            <optgroup label="انسولین‌های پایه (Long-Acting / Basal)">
                <option value="lantus">لانتوس (Glargine U-100) - Lantus</option>
                <option value="toujeo">توژئو (Glargine U-300) - Toujeo</option>
                <option value="tresiba">دگلودک (Tresiba / Degludec)</option>
                <option value="levemir">لِومیر (Detemir) - Levemir</option>
                <option value="nph_basal">ان‌پی‌اچ (NPH/Insulin Isophane)</option>
            </optgroup>
            <optgroup label="انسولین‌های مخلوط (Premixed / Bi-Phasic)">
                <option value="novomix">نوومیکس ۳۰ (NovoMix 30)</option>
                <option value="humalog_mix">هومالوگ میکس ۲۵ و ۵۰ (Humalog Mix)</option>
                <option value="ryzodeg">ریزودگ (Ryzodeg)</option>
                <option value="human_mix">مخلوط انسانی ۷۰/۳۰ (Human Mix 70/30)</option>
            </optgroup>
            <optgroup label="انسولین‌های کوتاه‌سوز و سریع‌الاثر (Bolus / Short-Acting)">
                <option value="apidra_novorapid">اسپارت/رپید/گلولیژن (NovoRapid, Apidra, Humalog)</option>
                <option value="regular">رگولار انسانی (Regular / R)</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="currentDose">💊 دوز کل فعلی بیمار (واحد):</label>
        <input type="number" id="currentDose" placeholder="مثلاً 30" min="1" max="100">
    </div>

    <div class="form-group" id="reductionBox">
        <label for="strategy">استراتژی کاهش دوز (برای جلوگیری از افت قند خون):</label>
        <select id="strategy">
            <option value="0.8">کاهش ۲۰ درصدی (پیشنهاد ایمن استاندارد)</option>
            <option value="1.0">تبدیل واحد به واحد (۱:۱ بدون کاهش)</option>
            <option value="0.85">کاهش ۱۵ درصدی</option>
        </select>
    </div>

    <div class="form-group">
        <label for="guideline">📚 انتخاب مرجع علمی (گایدلاین):</label>
        <select id="guideline">
            </select>
    </div>

    <button onclick="convertInsulin()">محاسبه تبدیل دقیق</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">💡 دوز پیشنهادی جدید:</div>
        <div id="resultText" style="font-size: 22px; font-weight: bold; color: #004085;"></div>
        <div id="descText" style="margin-top: 10px; font-size: 14px; line-height: 1.4;"></div>
    </div>

    <div class="alert-text" id="alertBox">
        <strong>⚠️ هشدار بالینی مهم:</strong> محاسبات بر اساس مرجع علمی منتخب انجام شده است. پایش قند خون و تیتراسیون توسط پزشک الزامی می‌سازد.
    </div>
</div>

<script>
    // سیستم فیلترینگ و هوشمندسازی منوی گایدلاین بر اساس نوع انسولین
    function updateGuidelines() {
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;
        const guidelineSelect = document.getElementById('guideline');
        
        // ذخیره انتخاب قبلی کاربر برای ارتقای تجربه کاربری
        const previousSelection = guidelineSelect.value;
        guidelineSelect.innerHTML = '';

        if (insFrom.includes('soliqua') || insTo.includes('soliqua')) {
            // اگر سولیکوآ در فرآیند تبدیل نقش داشته باشد
            guidelineSelect.innerHTML = `
                <option value="sanofi">پروتکل اختصاصی Sanofi / EMA / FDA (پیش‌فرض)</option>
                <option value="ada">انجمن دیابت آمریکا (ADA)</option>
            `;
        } else {
            // برای تبدیل سایر انسولین‌های جنرال بازار به یکدیگر
            guidelineSelect.innerHTML = `
                <option value="ada">انجمن دیابت آمریکا (ADA)</option>
                <option value="aace">کالج متخصصان غدد آمریکا (AACE)</option>
                <option value="canadian">دیابت کانادا (Diabetes Canada)</option>
                <option value="nice">گایدلاین بالینی انگلستان (NICE)</option>
            `;
            // بازگرداندن انتخاب قبلی در صورت وجود در لیست جدید
            if(['ada','aace','canadian','nice'].includes(previousSelection)) {
                guidelineSelect.value = previousSelection;
            }
        }
    }

    function getGroupType(val) {
        if(['lantus','toujeo','tresiba','levemir','nph_basal'].includes(val)) return 'basal';
        if(['novomix','humalog_mix','ryzodeg','human_mix'].includes(val)) return 'premix';
        if(val === 'soliqua_50' || val === 'soliqua_33') return 'soliqua';
        return 'bolus';
    }

    function convertInsulin() {
        const dose = parseFloat(document.getElementById('currentDose').value);
        const insFrom = document.getElementById('insFrom').value;
        const insTo = document.getElementById('insTo').value;
        const reduction = parseFloat(document.getElementById('strategy').value);
        const guide = document.getElementById('guideline').value.toUpperCase();

        if (isNaN(dose) || dose <= 0) {
            alert('لطفاً دوز معتبری وارد کنید.');
            return;
        }
        if (insFrom === insTo) {
            alert('انسولین مبدأ و مقصد نمی‌تواند یکسان باشد.');
            return;
        }

        let newDose = 0;
        let explanation = "";

        const fromGroup = getGroupType(insFrom);
        const toGroup = getGroupType(insTo);

        if (insTo === 'soliqua_50') {
            if (dose >= 20 && dose <= 30) {
                newDose = dose;
                explanation = `سوییچ به سولیکوآ ۱۰۰/۵۰ (قلم زرد). بر اساس پروتکل مرجع، برای بیماران با سابقه درمان انسولین پایه بین ۲۰ تا ۳۰ واحد، شروع واحد به واحد پیشنهاد می‌شود.`;
            } else if (dose < 20) {
                newDose = 10;
                explanation = `با توجه به دوز پایین قبلی، شروع ایمن از کف دوز قلم زرد (۱۰ واحد) توصیه می‌گردد.`;
            } else {
                newDose = 30;
                explanation = `دوز قبلی برای قلم زرد بالاست؛ پیشنهاد می‌شود وضعیت بیمار برای سوییچ مستقیم به قلم ۱۰۰/۳۳ (زیتونی) ارزیابی شود.`;
            }
        } 
        else if (insTo === 'soliqua_33') {
            if (insFrom === 'soliqua_50') {
                if (dose >= 40) {
                    newDose = 40;
                    explanation = `طبق پروتکل رسمی سانوفی، سقف دوز قلم ۱۰۰/۵۰ معادل ۴۰ واحد است. برای ادامه تیتراسیون افزایشی، بیمار باید با دوز ۴۰ واحد روی قلم ۱۰۰/۳۳ (زیتونی) سوییچ شود.`;
                } else {
                    newDose = dose;
                    explanation = `انتقال بین دو قلم بر اساس دوز فعلی بیمار تنظیم گردید.`;
                }
            } else if (dose >= 30) {
                newDose = 30;
                explanation = `سوییچ از انسولین پایه قبلی به سولیکوآ ۱۰۰/۳۳ (قلم زیتونی). برای دوزهای پایه قبلی ۳۰ واحد و بالاتر، دوز شروع استاندارد قلم زیتونی ۳۰ واحد است.`;
            } else {
                newDose = 30;
                explanation = `شروع پیش‌فرض قلم ۱۰۰/۳۳ بر اساس گایدلاین‌های مرجع ۳۰ واحد می‌باشد.`;
            }
        } 
        else {
            newDose = Math.round(dose * reduction);
            let redPercent = Math.round((1 - reduction) * 100);
            
            if (fromGroup === 'toujeo' && insTo === 'lantus') {
                newDose = Math.round(dose * 0.8);
                explanation = `تبدیل توژئو به لانتوس مطابق رفرنس ${guide}: کاهش ۲۰ درصدی دوز جهت جلوگیری از افت قند خون اعمال شد.`;
            } else if (fromGroup === 'basal' && toGroup === 'premix') {
                newDose = Math.round(dose * 0.8);
                explanation = `تغییر از انسولین پایه به پرمیکس/مخلوط مطابق رفرنس ${guide}: کل دوز انسولین پایه قبلی به ۸۰٪ کاهش یافته و ترجیحاً بر اساس ساختار محصول مقصد تقسیم بر وعده‌ها شود.`;
            } else if (fromGroup === 'premix' && toGroup === 'basal') {
                newDose = Math.round(dose * 0.8);
                explanation = `تغییر از پرمیکس به پایه مطابق رفرنس ${guide}: دوز انسولین پایه جدید معادل ۸۰٪ دوز کل پرمیکس قبلی پیشنهاد می‌شود.`;
            } else {
                explanation = `تبدیل بر اساس استراتژی منتخب در رفرنس ${guide} با اعمال ${redPercent}% تنظیم دوز احتیاطی انجام شد.`;
            }
        }

        document.getElementById('resultText').innerText = `${newDose} واحد`;
        document.getElementById('descText').innerText = explanation;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('alertBox').style.display = 'block';
    }

    // اجرای خودکار فیلترینگ منو هنگام لود اولیه صفحه
    window.onload = function() {
        updateGuidelines();
    };
</script>
</body>
</html>
